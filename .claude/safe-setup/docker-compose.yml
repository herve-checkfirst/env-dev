services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.claude
    # Docker-in-Docker needs SYS_ADMIN and an unconfined AppArmor profile, but
    # not the blanket `privileged: true` this used to carry: that also handed
    # over every other capability and host device access. See the threat model
    # in HACKING.md -- this narrows the blast radius, it does not make the
    # container a security boundary against hostile code.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # ../.. is the repository root, resolved relative to THIS file
      # (.claude/safe-setup/), not the parent of every project on the host.
      - ../..:/workspace
      - claude-history:/home/osint/.claude
      - bash-history:/home/osint/.bash_history_dir
      - docker-data:/var/lib/docker
    environment:
      - PGHOST=postgres
      - PGUSER=osint
      - PGPASSWORD=osint
      - PGDATABASE=osint
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    depends_on:
      - postgres
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=osint
      - POSTGRES_PASSWORD=osint
      - POSTGRES_DB=osint
    ports:
      # Bound to loopback: the dev container reaches Postgres over the compose
      # network anyway, so there is no reason to expose trivial credentials to
      # the local network. Port 5433 avoids clashing with a host Postgres.
      - "127.0.0.1:5433:5432"

volumes:
  claude-history:
  bash-history:
  docker-data:
